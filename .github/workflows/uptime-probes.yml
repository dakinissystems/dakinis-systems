# Uptime probes — fail only when an origin looks truly down.
# Complements Cloudflare Health Checks / Better Stack — see docs/UPTIME-EXTERNAL.md
#
# Free Cloudflare Bot Fight still challenges many GitHub runner IPs even after
# custom /health skip (BIC/SBFM). Those 403 "Just a moment…" are treated as
# warnings — use UptimeRobot/Better Stack for real alerts.

name: Uptime probes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-probes
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.repository == 'dakinissystems/dakinis-systems'
    timeout-minutes: 5
    steps:
      - name: Probe critical endpoints
        run: |
          set -euo pipefail
          fail=0
          cf_warn=0
          UA="DakinisUptimeProbe/1.0 (+https://github.com/dakinissystems/dakinis-systems)"
          probe() {
            local url="$1"
            local code
            code=$(curl -sS -o /tmp/uptime_body -w "%{http_code}" --max-time 20 \
              -A "$UA" -H "Accept: application/json,text/plain,*/*" "$url" || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "OK  $code  $url"
              return
            fi
            if grep -qi "Just a moment" /tmp/uptime_body 2>/dev/null; then
              echo "CF_CHALLENGE $code  $url"
              echo "::warning::Cloudflare Bot Fight challenged GitHub runner for $url — use external uptime (docs/UPTIME-EXTERNAL.md)"
              cf_warn=1
              return
            fi
            echo "FAIL $code  $url"
            head -c 400 /tmp/uptime_body || true
            echo
            fail=1
          }

          # Reachable from GH runners today (not blocked by free Bot Fight)
          probe "https://auth.dakinissystems.com/health"
          probe "https://api.akoenet.dakinissystems.com/health"
          probe "https://api.streamautomator.com/api/health"

          # Often challenged from datacenter IPs — warn only if CF interstitial
          probe "https://api.dakinissystems.com/health"
          probe "https://api.dakinissystems.com/core/api/health"
          probe "https://api.dakinissystems.com/billing/health"
          probe "https://api.dakinissystems.com/internal/health"
          probe "https://api.dakinissystems.com/streamautomator/api/health"
          probe "https://finance-api.dakinissystems.com/health"

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more uptime probes failed (non-Cloudflare) — see docs/UPTIME-EXTERNAL.md"
            exit 1
          fi
          if [ "$cf_warn" -ne 0 ]; then
            echo "UPTIME_PROBES_PASSED_WITH_CF_WARNINGS"
          else
            echo "UPTIME_PROBES_PASSED"
          fi
