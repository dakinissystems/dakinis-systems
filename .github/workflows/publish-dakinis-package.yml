name: Publish Dakinis package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Directory under packages/ (e.g. shared-error, shared-validation)"
        required: true
        type: string
        default: shared-error
  push:
    tags:
      - "shared-error-v*"
      - "shared-validation-v*"
      - "domain-v*"
      - "shared-loading-v*"
      - "shared-db-v*"
      - "sdk-metrics-v*"
      - "shared-auth-v*"
      - "shared-platform-v*"
      - "shared-ai-v*"
      - "shared-feature-flags-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package directory
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIR="${{ inputs.package }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DIR="${TAG%-v*}"
          fi
          if [ ! -f "packages/$DIR/package.json" ]; then
            echo "Missing packages/$DIR/package.json"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing packages/$DIR"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@dakinissystems"

      - name: Rewrite file: deps to sibling versions
        working-directory: packages/${{ steps.pkg.outputs.dir }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const pkgPath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          function rewrite(deps) {
            if (!deps) return;
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== "string" || !ver.startsWith("file:")) continue;
              const rel = ver.replace(/^file:/, "");
              const siblingPkg = path.resolve(rel, "package.json");
              const sibling = JSON.parse(fs.readFileSync(siblingPkg, "utf8"));
              if (sibling.name !== name) {
                console.warn(`warn: dep key ${name} != sibling name ${sibling.name}`);
              }
              deps[name] = sibling.version;
              console.log(`rewrite ${name}: ${ver} -> ${sibling.version}`);
            }
          }
          rewrite(pkg.dependencies);
          rewrite(pkg.optionalDependencies);
          rewrite(pkg.devDependencies);
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

      - name: Publish @dakinissystems/${{ steps.pkg.outputs.dir }}
        working-directory: packages/${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
