# B11 — Circuito comercial diario (venta/inventario/Hub/plan = probes públicos).
# Full E2E con cobro real sigue siendo B6 (operador). Este job falla el workflow si un probe cae.

name: Smoke commercial circuit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-commercial-circuit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'dakinissystems/dakinis-systems'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https software-properties-common
            wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi

      - name: Run commercial circuit smoke
        shell: pwsh
        run: |
          ./scripts/smoke-commercial-circuit.ps1 -WriteEvidence

      - name: Upload dated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b11-commercial-smoke-${{ github.run_id }}
          path: tmp/B11-smoke-*.md
          if-no-files-found: ignore
          retention-days: 30
