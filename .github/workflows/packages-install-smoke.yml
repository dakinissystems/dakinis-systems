name: Packages install smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@dakinissystems"

      - name: Install published packages
        env:
          # Prefer dedicated read PAT; fall back to GITHUB_TOKEN (same-org packages:read).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          mkdir -p /tmp/dakinis-pkg-smoke && cd /tmp/dakinis-pkg-smoke
          npm init -y
          npm install \
            @dakinissystems/shared-error@0.1.0 \
            @dakinissystems/shared-validation@0.1.0 \
            @dakinissystems/domain@0.1.0 \
            @dakinissystems/shared-loading@0.1.0 \
            @dakinissystems/shared-db@0.1.0 \
            @dakinissystems/sdk-metrics@0.1.0 \
            @dakinissystems/shared-auth@1.0.1 \
            @dakinissystems/shared-ai@0.1.0 \
            @dakinissystems/shared-platform@0.2.0 \
            @dakinissystems/shared-feature-flags@0.1.0 \
            @dakinissystems/shared-brand@1.0.1 \
            @dakinissystems/shared-icons@0.1.0 \
            @dakinissystems/sdk-auth@0.1.0 \
            @dakinissystems/sdk-billing@0.1.0 \
            @dakinissystems/sdk-events@0.1.0 \
            @dakinissystems/sdk-workspace@0.1.0 \
            @dakinissystems/sdk@0.2.0 \
            @dakinissystems/shared-illustrations@0.1.0 \
            @dakinissystems/shared-ux@0.2.0 \
            @dakinissystems/shared-layouts@1.0.0 \
            @dakinissystems/shared-des@1.0.0 \
            @dakinissystems/shared-charts@0.1.0 \
            @dakinissystems/design-system@1.0.0 \
            @dakinissystems/design-audit@0.1.0
          node -e "require('@dakinissystems/shared-error'); console.log('shared-error ok')"
          # Node-native ESM packages (no JSX)
          for pkg in shared-validation domain shared-loading shared-db sdk-metrics shared-auth shared-ai shared-platform shared-feature-flags shared-brand shared-icons sdk-auth sdk-billing sdk-events sdk-workspace sdk shared-illustrations shared-des shared-charts; do
            node --input-type=module -e "import('@dakinissystems/' + process.argv[1]).then(()=>console.log(process.argv[1] + ' ok'))" "$pkg"
          done
          # React/JSX packages: install-only check (Node cannot load .jsx without a bundler)
          for pkg in shared-ux shared-layouts design-system design-audit; do
            node -e "require('fs').accessSync('node_modules/@dakinissystems/' + process.argv[1] + '/package.json'); console.log(process.argv[1] + ' installed')" "$pkg"
          done
          node --input-type=module -e "import('@dakinissystems/shared-ux/motion').then(()=>console.log('shared-ux/motion ok'))"
          node --input-type=module -e "import('@dakinissystems/shared-layouts/dashboard-template').then(()=>console.log('shared-layouts/dashboard-template ok'))"
          node --input-type=module -e "import('@dakinissystems/design-system/ui-states').then(()=>console.log('design-system/ui-states ok'))"
