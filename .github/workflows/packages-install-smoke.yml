name: Packages install smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@dakinissystems"

      - name: Install published packages
        env:
          # Prefer dedicated read PAT; fall back to GITHUB_TOKEN (same-org packages:read).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          mkdir -p /tmp/dakinis-pkg-smoke && cd /tmp/dakinis-pkg-smoke
          npm init -y
          npm install \
            @dakinissystems/shared-error@0.1.0 \
            @dakinissystems/shared-validation@0.1.0 \
            @dakinissystems/domain@0.1.0 \
            @dakinissystems/shared-loading@0.1.0 \
            @dakinissystems/shared-db@0.1.0 \
            @dakinissystems/sdk-metrics@0.1.0 \
            @dakinissystems/shared-auth@1.0.1 \
            @dakinissystems/shared-ai@0.1.0 \
            @dakinissystems/shared-platform@0.2.0 \
            @dakinissystems/shared-feature-flags@0.1.0 \
            @dakinissystems/shared-brand@1.0.1 \
            @dakinissystems/shared-icons@0.1.0 \
            @dakinissystems/sdk-auth@0.1.0
          node -e "require('@dakinissystems/shared-error'); console.log('shared-error ok')"
          for pkg in shared-validation domain shared-loading shared-db sdk-metrics shared-auth shared-ai shared-platform shared-feature-flags shared-brand shared-icons sdk-auth; do
            node --input-type=module -e "import('@dakinissystems/' + process.argv[1]).then(()=>console.log(process.argv[1] + ' ok'))" "$pkg"
          done
