name: Postgres backup

# Cliente pg_dump vía imagen Postgres 17 (Supabase prod = 17.x).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.repository == 'dakinissystems/dakinis-systems'
    steps:
      - uses: actions/checkout@v7

      - name: pg_dump to artifact
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PG_IMAGE: pgvector/pgvector:pg17
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::BACKUP_DATABASE_URL not set. Use scripts/backup-postgres.ps1 locally."
            exit 0
          fi

          # Prefer session pooler (IPv4) over direct db.*.supabase.co (often IPv6-only)
          DUMP_URL="$(node scripts/pg-dump-compatible-url.mjs)"
          node scripts/pg-dump-compatible-url.mjs --summary

          docker run --rm \
            -e DATABASE_URL="$DUMP_URL" \
            -v "$PWD:/out" \
            "$PG_IMAGE" \
            bash -c 'set -euo pipefail
              pg_dump "$DATABASE_URL" --no-owner --no-acl \
                --exclude-schema=vault \
                --exclude-schema=pgsodium \
                --exclude-schema=graphql \
                --exclude-schema=graphql_public \
                --exclude-schema=realtime \
                --exclude-schema=_realtime \
                --exclude-schema=supabase_functions \
                --exclude-schema=net \
                --exclude-schema=pgbouncer \
                | gzip -c > /out/backup.sql.gz
              ls -lh /out/backup.sql.gz'

      - uses: actions/upload-artifact@v4
        if: hashFiles('backup.sql.gz') != ''
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 14

      - name: Restore test reminder
        run: |
          echo "Monthly: workflow restore-postgres-test.yml or scripts/restore-postgres-test.ps1"
